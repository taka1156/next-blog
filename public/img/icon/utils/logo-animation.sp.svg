<svg viewBox="0 0 900 1600" xmlns="http://www.w3.org/2000/svg" role="img" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="display:block;max-width:100%;height:auto;">
<title>TypeScript, JavaScript, Go, Moonbit のロゴが画面全体（縦方向にも大きく）に散らばり、集まってコンテナとなり積み重なって Webspaces ロゴになるアニメーション（縦長/SP向け構図）</title>

<style>
  text {
    font-family: ui-monospace, "SF Mono", "Consolas", monospace;
    font-weight: 700;
    text-anchor: middle;
    dominant-baseline: middle;
  }

  .badge-text { font-size: 26px; }

  .cube-shape {
    fill: none;
    stroke-width: 8px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .wordmark {
    font-size: 90px;
    font-weight: 500;
    fill: #000000;
    text-anchor: middle;
    animation: wordmark-op 6s ease-in-out infinite;
  }

  .scene { animation: scene-op 6s ease-in-out infinite; }

  @keyframes scene-op {
    0%   { opacity: 1; }
    95%  { opacity: 1; }
    99%  { opacity: 0; }
    100% { opacity: 0; }
  }

  @keyframes wordmark-op {
    0%   { opacity: 0; }
    60%  { opacity: 0; }
    68%  { opacity: 1; }
    90%  { opacity: 1; }
    97%  { opacity: 0; }
    100% { opacity: 0; }
  }
</style>

