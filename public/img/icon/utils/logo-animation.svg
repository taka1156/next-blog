<svg viewBox="0 0 1300 480" xmlns="http://www.w3.org/2000/svg" role="img" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="display:block;max-width:100%;height:auto;">
<title>TypeScript, JavaScript, Go, Moonbit のロゴが画面に散らばり、集まってコンテナとなり積み重なって Webspaces ロゴになるアニメーション</title>

<style>
  text {
    font-family: ui-monospace, "SF Mono", "Consolas", monospace;
    font-weight: 700;
    text-anchor: middle;
    dominant-baseline: middle;
  }

  .badge-text { font-size: 26px; }

  .cube-shape {
    fill: none;
    stroke-width: 8px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .wordmark {
    font-size: 90px;
    font-weight: 500;
    fill: #000000;
    text-anchor: start;
    animation: wordmark-op 6s ease-in-out infinite;
  }

  .scene { animation: scene-op 6s ease-in-out infinite; }

  @keyframes scene-op {
    0%   { opacity: 1; }
    95%  { opacity: 1; }
    99%  { opacity: 0; }
    100% { opacity: 0; }
  }

  @keyframes wordmark-op {
    0%   { opacity: 0; }
    60%  { opacity: 0; }
    68%  { opacity: 1; }
    90%  { opacity: 1; }
    97%  { opacity: 0; }
    100% { opacity: 0; }
  }
</style>

<g class="scene">

  <!-- ============ TypeScript group -> large blue base cube ============ -->
  <g transform="translate(366,283)">
    <!-- scattered badges -->
    <g transform="rotate(-12)">
      <animateTransform attributeName="transform" type="translate" additive="sum"
        values="-246,-223;-246,-223;0,0;0,0" keyTimes="0;0.15;0.30;1" dur="6s" repeatCount="indefinite"/>
      <rect x="-28" y="-28" width="56" height="56" rx="10" fill="#3178c6"/>
      <text class="badge-text" fill="#ffffff">TS</text>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.15;0.30;1" dur="6s" repeatCount="indefinite"/>
    </g>
    <g transform="rotate(9)">
      <animateTransform attributeName="transform" type="translate" additive="sum"
