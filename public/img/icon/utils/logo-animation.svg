      <rect x="-28" y="-28" width="56" height="56" rx="10" fill="#3178c6"/>
      <text class="badge-text" fill="#ffffff">TS</text>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.15;0.30;1" dur="6s" repeatCount="indefinite"/>
    </g>
    <g transform="rotate(15)">
